services:
  postgres:
    image: postgres:15-alpine
    container_name: pmb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pmb_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pmb_password}
      POSTGRES_DB: ${DB_NAME:-pmb_auth}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pmb_user} -d ${DB_NAME:-pmb_auth}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - pmb-network

  redis:
    image: redis:7-alpine
    container_name: pmb-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pmb-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: pmb-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - pmb-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: pmb-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - pmb-network

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: pmb-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb -p local/pmb-admission-documents;
      /usr/bin/mc mb -p local/pmb-identity-photos;
      /usr/bin/mc mb -p local/pmb-identity-ktp;
      /usr/bin/mc mb -p local/pmb-finance-proofs;
      /usr/bin/mc mb -p local/pmb-finance-receipts;
      /usr/bin/mc mb -p local/pmb-exam-cards;
      exit 0;
      "
    networks:
      - pmb-network

  # ---------------------------------------------------------------------------
  # 3 KONSOLIDASI LAYANAN APLIKASI (CR-011)
  # ---------------------------------------------------------------------------

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    container_name: pmb-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8081:8081"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8000
      INTERNAL_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pmb_user}
      DB_PASSWORD: ${DB_PASSWORD:-pmb_password}
      DB_NAME: pmb_auth
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/certs/jwt_private.pem}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH:-/certs/jwt_public.pem}
      JWT_KID: ${JWT_KID:-pmb-auth-1}
      JWT_ISSUER: ${JWT_ISSUER:-pmb-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pmb-api}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-secret-internal-token}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-secret-gateway-hmac}
      ROUTES_CONFIG: /app/config/routes.yaml
      PMB_SERVICE_URL: http://pmb-service:8080
      OCR_SERVICE_URL: http://ocr-service:8088
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      MAIL_DRIVER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: pmb@kampus.ac.id
      MAIL_FROM_NAME: PMB Universitas
    volumes:
      - ../certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pmb-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      - pmb-network

  pmb-service:
    build:
      context: ..
      dockerfile: services/pmb-service/Dockerfile
    container_name: pmb-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pmb_user}
      DB_PASSWORD: ${DB_PASSWORD:-pmb_password}
      DB_NAME: pmb_app
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET:-secret-gateway-hmac}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-secret-internal-token}
      GATEWAY_INTERNAL_URL: http://gateway:8081
      OCR_SERVICE_URL: http://ocr-service:8088
      OCR_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_USE_SSL: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM_EMAIL: pmb@kampus.ac.id
      SMTP_FROM_NAME: PMB Universitas
      OUTBOX_INTERVAL_SECONDS: 2
      OUTBOX_BATCH_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 30s
    networks:
      - pmb-network

  ocr-service:
    build:
      context: ../services/ocr-service
      dockerfile: Dockerfile
    container_name: pmb-ocr-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: 8088
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-secret-internal-token}
      REDIS_ADDR: redis:6379
      OCR_ENGINE: tesseract
      OCR_QUALITY_THRESHOLD: 70
      OCR_FIELD_CONFIDENCE_THRESHOLD: 0.85
      OCR_RESULT_TTL: 15m
      OCR_MAX_FILE_MB: 5
      OCR_CLOUD_ENABLED: "false"
      WORKER_CONCURRENCY: 2
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8088/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 45s
    networks:
      - pmb-network

  # Observability profile
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: pmb-jaeger
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "16686:16686" # Web UI
      - "14268:14268" # HTTP Jaeger collector
    networks:
      - pmb-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: pmb-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - pmb-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  pmb-network:
    driver: bridge
