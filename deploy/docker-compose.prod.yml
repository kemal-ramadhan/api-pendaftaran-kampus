services:
  postgres:
    image: postgres:15-alpine
    container_name: pmb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pmb_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pmb_password}
      POSTGRES_DB: ${DB_NAME:-pmb_auth}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pmb_user} -d ${DB_NAME:-pmb_auth}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - pmb-network

  redis:
    image: redis:7-alpine
    container_name: pmb-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-pmb_redis_secret}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-pmb_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - pmb-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: pmb-minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - pmb-network

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: pmb-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      /usr/bin/mc mb -p local/pmb-admission-documents;
      /usr/bin/mc mb -p local/pmb-identity-photos;
      /usr/bin/mc mb -p local/pmb-identity-ktp;
      /usr/bin/mc mb -p local/pmb-finance-proofs;
      /usr/bin/mc mb -p local/pmb-finance-receipts;
      /usr/bin/mc mb -p local/pmb-exam-cards;
      exit 0;
      "
    networks:
      - pmb-network

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    container_name: pmb-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8081:8081"
    environment:
      APP_ENV: production
      APP_PORT: 8000
      INTERNAL_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pmb_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: pmb_auth
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pmb_redis_secret}
      JWT_PRIVATE_KEY_PATH: /certs/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /certs/jwt_public.pem
      JWT_KID: ${JWT_KID:-pmb-auth-1}
      JWT_ISSUER: ${JWT_ISSUER:-pmb-auth-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pmb-api}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      ROUTES_CONFIG: /app/config/routes.yaml
      PMB_SERVICE_URL: http://pmb-service:8080
      OCR_SERVICE_URL: http://ocr-service:8088
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-pmb@kampus.ac.id}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-PMB Universitas}
    volumes:
      - ../certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pmb-service:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - pmb-network

  pmb-service:
    build:
      context: ..
      dockerfile: services/pmb-service/Dockerfile
    container_name: pmb-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-pmb_user}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: pmb_app
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pmb_redis_secret}
      GATEWAY_SHARED_SECRET: ${GATEWAY_SHARED_SECRET}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      GATEWAY_INTERNAL_URL: http://gateway:8081
      OCR_SERVICE_URL: http://ocr-service:8088
      OCR_ENABLED: "true"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      SMTP_HOST: ${MAIL_HOST}
      SMTP_PORT: ${MAIL_PORT:-587}
      SMTP_FROM_EMAIL: ${MAIL_FROM_ADDRESS:-pmb@kampus.ac.id}
      SMTP_FROM_NAME: ${MAIL_FROM_NAME:-PMB Universitas}
      OUTBOX_INTERVAL_SECONDS: 2
      OUTBOX_BATCH_SIZE: 50
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - pmb-network

  ocr-service:
    build:
      context: ../services/ocr-service
      dockerfile: Dockerfile
    container_name: pmb-ocr-service
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      APP_ENV: production
      PORT: 8088
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pmb_redis_secret}
      OCR_ENGINE: tesseract
      OCR_QUALITY_THRESHOLD: 70
      OCR_FIELD_CONFIDENCE_THRESHOLD: 0.85
      OCR_RESULT_TTL: 15m
      OCR_MAX_FILE_MB: 5
      OCR_CLOUD_ENABLED: "false"
      WORKER_CONCURRENCY: 4
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - pmb-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  pmb-network:
    driver: bridge
