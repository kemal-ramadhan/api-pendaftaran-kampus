services:
  auth:
    url: ${AUTH_SERVICE_URL}
    timeout: 10s
  ocr:
    url: ${OCR_SERVICE_URL}
    timeout: 30s
    max_body: 10MB
  organization:
    url: ${ORGANIZATION_SERVICE_URL}
    timeout: 10s
  identity:
    url: ${IDENTITY_SERVICE_URL}
    timeout: 15s
    max_body: 5MB
  admission:
    url: ${ADMISSION_SERVICE_URL}
    timeout: 15s
    max_body: 10MB
  finance:
    url: ${FINANCE_SERVICE_URL}
    timeout: 15s
    max_body: 10MB
  exam:
    url: ${EXAM_SERVICE_URL}
    timeout: 15s
    max_body: 5MB
  scoring:
    url: ${SCORING_SERVICE_URL}
    timeout: 15s
    max_body: 5MB
  selection:
    url: ${SELECTION_SERVICE_URL}
    timeout: 15s
    max_body: 5MB
  student:
    url: ${STUDENT_SERVICE_URL}
    timeout: 15s
    max_body: 5MB
  nim:
    url: ${NIM_SERVICE_URL}
    timeout: 15s
    max_body: 5MB

routes:
  - prefix: /api/v1/auth/.well-known
    service: auth
    rewrite: /.well-known
    auth: public
  - prefix: /api/v1/auth/admin
    service: auth
    rewrite: /auth/admin
    auth: required
    roles: [superadmin]
  - prefix: /api/v1/auth
    service: auth
    rewrite: /auth
    auth: required
    public_paths:
      - POST /register
      - POST /verify
      - GET /health
      - POST /resend-otp
      - POST /login
      - POST /refresh
      - POST /forgot-password
      - POST /reset-password
    rate_limit: { requests: 60, window: 1m }
  # OCR Service berstatus internal-only (PRD C.4.11), tidak diekspos di Gateway.
  # Calon mahasiswa mengakses OCR KTP melalui Identity Service (/api/v1/identity/me/ktp-scan).
  - prefix: /api/v1/organization/admin
    service: organization
    rewrite: /organization/admin
    auth: required
    roles: [superadmin]
  - prefix: /api/v1/organization
    service: organization
    rewrite: /organization
    auth: public
  - prefix: /api/v1/identity/admin
    service: identity
    rewrite: /identity/admin
    auth: required
    roles: [admin_pmb, superadmin]
  - prefix: /api/v1/identity
    service: identity
    rewrite: /identity
    auth: required
    max_body: 5MB
  - prefix: /api/v1/admission/admin
    service: admission
    rewrite: /admission/admin
    auth: required
    roles: [admin_pmb, superadmin, prodi, pimpinan]
  - prefix: /api/v1/admission
    service: admission
    rewrite: /admission
    auth: required
    public_paths:
      - GET /periods/active
      - GET /paths
    max_body: 10MB
  - prefix: /api/v1/webhooks/payments
    service: finance
    rewrite: /webhooks/payments
    auth: public
  - prefix: /api/v1/dev/payments
    service: finance
    rewrite: /dev/payments
    auth: public
  - prefix: /api/v1/finance/admin
    service: finance
    rewrite: /finance/admin
    auth: required
    roles: [keuangan, superadmin, admin_pmb, pimpinan]
    max_body: 10MB
  - prefix: /api/v1/receipts
    service: finance
    rewrite: /receipts
    auth: required
  - prefix: /api/v1/invoices
    service: finance
    rewrite: /invoices
    auth: required
    max_body: 10MB
  - prefix: /api/v1/exam/admin
    service: exam
    rewrite: /exam/admin
    auth: required
    roles: [admin_pmb, superadmin, dosen]
    max_body: 5MB
  - prefix: /api/v1/exam/examiner
    service: exam
    rewrite: /exam/examiner
    auth: required
    roles: [dosen, admin_pmb, superadmin]
    max_body: 5MB
  - prefix: /api/v1/exam/me
    service: exam
    rewrite: /exam/me
    auth: required
    roles: [calon_mahasiswa, admin_pmb, superadmin]
  - prefix: /api/v1/scoring/admin
    service: scoring
    rewrite: /scoring/admin
    auth: required
    roles: [admin_pmb, superadmin]
    max_body: 5MB
  - prefix: /api/v1/scoring/examiner
    service: scoring
    rewrite: /scoring/examiner
    auth: required
    roles: [dosen, admin_pmb, superadmin]
    max_body: 5MB
  - prefix: /api/v1/scoring/program
    service: scoring
    rewrite: /scoring/program
    auth: required
    roles: [prodi, admin_pmb, superadmin, pimpinan]
    max_body: 5MB
  - prefix: /api/v1/selection/program
    service: selection
    rewrite: /selection/program
    auth: required
    roles: [prodi, admin_pmb, superadmin]
    max_body: 5MB
  - prefix: /api/v1/selection/approval
    service: selection
    rewrite: /selection/approval
    auth: required
    roles: [pimpinan, superadmin]
    max_body: 5MB
  - prefix: /api/v1/selection/admin
    service: selection
    rewrite: /selection/admin
    auth: required
    roles: [admin_pmb, superadmin]
    max_body: 5MB
  - prefix: /api/v1/selection/me
    service: selection
    rewrite: /selection/me
    auth: required
    roles: [calon_mahasiswa, admin_pmb, superadmin]
  - prefix: /api/v1/student/admin
    service: student
    rewrite: /student/admin
    auth: required
    roles: [admin_pmb, superadmin, prodi, pimpinan]
    max_body: 5MB
  - prefix: /api/v1/student/me
    service: student
    rewrite: /student/me
    auth: required
    roles: [calon_mahasiswa, admin_pmb, superadmin]
    max_body: 5MB
  - prefix: /api/v1/nim/admin/formats
    service: nim
    rewrite: /nim/admin/formats
    auth: required
    roles: [superadmin]
    max_body: 5MB
  - prefix: /api/v1/nim/admin/issuances
    service: nim
    rewrite: /nim/admin/issuances
    auth: required
    roles: [admin_pmb, superadmin, prodi, pimpinan]
    max_body: 5MB
  - prefix: /api/v1/nim/admin
    service: nim
    rewrite: /nim/admin
    auth: required
    roles: [admin_pmb, superadmin, prodi, pimpinan]
    max_body: 5MB



